<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel 33º BPM/I</title>
<style>
:root{--bg:#0b0d12;--c:#141821;--b:#232937;--t:#e8ecf3;--m:#8b94a7;--o:#f59e0b;--r:#ef4444;--g:#22c55e;--bl:#38a0e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Segoe UI,sans-serif}
button{background:var(--o);color:#111;border:0;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
button.ghost{background:transparent;color:var(--t);border:1px solid var(--b)}button.sm{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;background:#0f131b;border:1px solid var(--b);color:var(--t);border-radius:7px;padding:9px 11px;font:inherit;margin-top:5px}
label{display:block;color:var(--m);margin-bottom:12px;font-size:13px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lb{width:100%;max-width:370px;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:28px}
.lb h1{margin:8px 0 2px;font-size:22px}.lb p{color:var(--m);margin:0 0 20px}.shield{font-size:34px;color:var(--o)}
#app{display:flex;min-height:100vh}aside{width:224px;border-right:1px solid var(--b);padding:16px 10px;flex-shrink:0}
.brand{padding:4px 10px 16px;font-weight:700}.brand img{height:64px;display:block;margin-bottom:8px}.brand small{display:block;color:var(--m);font-weight:400;font-size:11px}
nav a{display:block;padding:10px;border-radius:8px;color:var(--t);cursor:pointer;margin-bottom:3px}nav a.on{background:var(--c);color:var(--o)}
.who{margin-top:18px;padding:10px;color:var(--m);font-size:12px;border-top:1px solid var(--b)}
main{flex:1;padding:26px;min-width:0}h2{margin:0}.sub{color:var(--m);margin:3px 0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:16px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:16px}
.big{font-size:28px;font-weight:700;margin-top:4px}.k{color:var(--m);font-size:12px;letter-spacing:.04em}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:620px}
th{color:var(--m);font-weight:500;text-align:left;padding:12px 14px;font-size:12px}td{padding:12px 14px;border-top:1px solid var(--b)}
tr.cl{cursor:pointer}tr.cl:hover{background:#181d28}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}.bar i{display:block;height:14px;background:var(--o);border-radius:0 3px 3px 0}.bar span:first-child{width:120px;text-align:right;flex-shrink:0}
.tag{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#222936}
.EM{color:var(--o);background:#f59e0b22}.AG{color:var(--r);background:#ef444422}.FI{color:var(--g);background:#22c55e22}.CA{color:var(--m)}
.ALTA{color:var(--r);font-weight:700}.MÉDIA{color:var(--o);font-weight:700}.BAIXA{color:var(--g);font-weight:700}
.bar2{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.bar2 input,.bar2 select{width:auto;margin:0;min-width:150px}.bar2 input{flex:1}
.chip{background:transparent;color:var(--t);border:1px solid var(--b)}.chip.on{background:var(--o);color:#111}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;padding:14px;z-index:9}
.box{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
