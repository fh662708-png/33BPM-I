function editarDesc(i){if(!fullLinks())return;let a=DB.g('linksDesc',[]),x=a[i];modal('Editar descrição',[['title','Título do item','text',0,1],['desc','Descrição','area',0,1]],v=>{a[i]=v;DB.s('linksDesc',a);R()});$('#f_title').value=x.title||'';$('#f_desc').value=x.desc||''}
function exportarQTS(){try{const a=DB.g('qts',[]).filter(x=>!S.qt||x.t==S.qt);if(!a.length){alert('Não há registros de QTS para exportar com o filtro selecionado.');return}const rows=a.map(x=>'<tr><td>'+e(x.d||'')+'</td><td>'+e(x.t||'')+'</td><td>'+e(x.f&&x.f.n||x.f||'')+'</td><td>'+e(x.g&&x.g.n||x.g||'')+'</td><td>'+e(x.au||'')+'</td></tr>').join('');baixarExcel('QTS','<h2>Relatório QTS</h2><p>Total de registros: '+a.length+'</p><table><thead><tr><th>Data</th><th>Tipo QTS</th><th>Arquivo PDF</th><th>TDS / Preleção</th><th>Enviado por</th></tr></thead><tbody>'+rows+'</tbody></table>')}catch(err){console.error(err);alert('Não foi possível exportar os registros QTS.')}}

function qapNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim().replace(/[.]/g,'')}
function exportarAtDetalhado(k){let isOp=k==='qop',items=isOp?QOP:QL,a=DB.g(k,[]).filter(x=>(!S.qd||x.d==S.qd)&&(isOp||!S.qa||x.at==S.qa));let rows=a.map(x=>`<tr><td>${e(x.d)}</td><td>${e(x.cia)}</td>${isOp?'':`<td>${e(x.at)}</td>`}${items.map(n=>`<td>${e(x.q&&x.q[n]||0)}</td>`).join('')}<td>${e(x.re)}</td><td>${e(x.au)}</td></tr>`).join('');baixarExcel(isOp?'QAP_Operacao':'QAP',`<h2>${isOp?'QAP Operação':'QAP'}</h2><table><tr><th>Data</th><th>Cia</th>${isOp?'': '<th>Atividade</th>'}${items.map(n=>`<th>${e(n)}</th>`).join('')}<th>RE</th><th>Lançado por</th></tr>${rows}</table>`)}
function exportarAt(k){
  if(k==='qop'){exportarAtDetalhado(k);return;}
  const agora=new Date(),mesAtual=agora.getMonth()+1,anoAtual=agora.getFullYear();
  const registros=DB.g('qlan',[]);
  const anos=[...new Set([anoAtual,...registros.map(x=>Number(String(x.d||'').slice(0,4))).filter(y=>y>=2000&&y<=2100)])].sort((a,b)=>b-a);
  const meses=[MES[mesAtual-1],...MES.filter((_,i)=>i!==mesAtual-1)];
  modal('Exportar QAP — escolher período',[
    ['mes','Mês','select',meses],
    ['ano','Ano','select',anos.map(String)]
  ],v=>{
    const mes=MES.indexOf(v.mes)+1,ano=Number(v.ano);
    exportarQAPPeriodo(mes,ano);
  });
}
async function exportarQAPPeriodo(mes,ano){
  try{
    if(!window.ExcelJS)throw new Error('Biblioteca Excel não carregada. Verifique sua conexão com a internet e tente novamente.');
    const mesNome=MES[mes-1]||String(mes).padStart(2,'0');
    const partesData=v=>{
      if(v instanceof Date)return {ano:v.getFullYear(),mes:v.getMonth()+1,dia:v.getDate()};
      const s=String(v||'').trim();
      let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if(m)return {ano:+m[1],mes:+m[2],dia:+m[3]};
      m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(m)return {ano:+m[3],mes:+m[2],dia:+m[1]};
      return null;
    };
    const hoje=new Date();
    const anoHoje=hoje.getFullYear(),mesHoje=hoje.getMonth()+1,diaHoje=hoje.getDate();
    const periodoAtual=Number(ano)===anoHoje&&Number(mes)===mesHoje;
    const todos=DB.g('qlan',[]).filter(x=>{
      const d=partesData(x&&x.d);
      if(!d||d.ano!==Number(ano)||d.mes!==Number(mes))return false;
      // No mês corrente, considerar somente lançamentos até o dia de hoje.
      if(periodoAtual&&d.dia>diaHoje)return false;
      return true;
    });
    if(!todos.length&&!confirm('Não há lançamentos de QAP em '+mesNome+'/'+ano+'. Deseja gerar mesmo assim a planilha vazia no modelo oficial?'))return;

    const raw=Uint8Array.from(atob(QAP_MODELO_XLSX_B64),c=>c.charCodeAt(0));
    const book=new ExcelJS.Workbook();
    await book.xlsx.load(raw);
    const cabecalho=['OCORRÊNCIA','1 CIA','2 CIA','3 CIA','4 CIA','F.T.','EM','TOTAL'];
    const normalCia=v=>{
      const n=qapNorm(v).replace(/[^a-z0-9]/g,'');
      if(n==='1cia'||n==='1cia')return 0;
      if(n==='2cia')return 1;
      if(n==='3cia')return 2;
      if(n==='4cia')return 3;
      if(n==='ft'||n.includes('forcatatica'))return 4;
      if(n==='em'||n.includes('estadomaior'))return 5;
      return -1;
    };
    const indicadores=QL.map(q=>[q,qapNorm(q)]);
    const linhaIndicador=ws=>{
      const map=new Map();
      for(let r=1;r<=ws.rowCount;r++){
        const v=ws.getCell(r,1).value;
        if(v!==null&&v!==undefined){
          const key=qapNorm(typeof v==='object'&&v.text?v.text:v);
          if(key&&!map.has(key))map.set(key,r);
        }
      }
      return map;
    };
    const acumulado={};
    for(let dia=1;dia<=31;dia++){
      const ws=book.getWorksheet(String(dia).padStart(2,'0'));
      if(!ws)continue;
      cabecalho.forEach((v,i)=>{ws.getCell(8,i+1).value=v;});
      ws.getCell('B6').value=dia;
      ws.getCell('D6').value=ano;
      const linhas=linhaIndicador(ws);
      for(const [nome,norm] of indicadores){
        const r=linhas.get(norm);
        if(!r)continue;
        const vals=[0,0,0,0,0,0];
        for(const x of todos){
          const d=partesData(x.d);
          if(!d||d.dia!==dia)continue;
          const ci=normalCia(x.cia);
          if(ci<0)continue;
          const value=Number(x.q&&x.q[nome])||0;
          vals[ci]+=value;
        }
        for(let j=0;j<6;j++)ws.getCell(r,2+j).value=vals[j];
        ws.getCell(r,8).value=vals.reduce((a,b)=>a+b,0);
        if(!acumulado[norm])acumulado[norm]=[0,0,0,0,0,0];
        for(let j=0;j<6;j++)acumulado[norm][j]+=vals[j];
      }
    }
    const total=book.getWorksheet('TOTAL');
    if(total){
      cabecalho.forEach((v,i)=>{total.getCell(8,i+1).value=v;});
      total.getCell('B6').value='TOTAL '+String(mesNome).toUpperCase()+' '+ano;
      const linhas=linhaIndicador(total);
      for(const [nome,norm] of indicadores){
        const r=linhas.get(norm);
        if(!r)continue;
        const vals=acumulado[norm]||[0,0,0,0,0,0];
        for(let j=0;j<6;j++)total.getCell(r,2+j).value=vals[j];
        total.getCell(r,8).value=vals.reduce((a,b)=>a+b,0);
      }
    }
    const buffer=await book.xlsx.writeBuffer();
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='QAP_ACUMULADO_'+String(mes).padStart(2,'0')+'_'+ano+'.xlsx';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    if(typeof toast==='function')toast(todos.length+' lançamentos do QAP incluídos em '+mesNome+'/'+ano+(periodoAtual?' até o dia '+diaHoje:'')+'.');
  }catch(err){
    console.error(err);
    alert('Não foi possível gerar o Excel do QAP: '+(err&&err.message?err.message:'erro inesperado'));
  }
}
function pdf(){let n=(TABS.find(t=>t[0]==S.tab)||[0,'Painel'])[1],o=document.title;document.title='33BPMI_'+n.replace(/\s+/g,'_')+'_'+today();print();setTimeout(()=>document.title=o,800)}

function pdfResumoBancoHoras(){if(!fullLinks())return alert('Somente logins oficiais podem gerar este relatório.');const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');let raw=DB.g('linkcia',[]);if(!Array.isArray(raw)&&raw&&typeof raw==='object')raw=Object.values(raw);if(!Array.isArray(raw))raw=[];const accepted=['aceito','aceita','aprovado','aprovada','accepted','aprovadopelooficial','deferido','deferida'];let a=raw.filter(x=>norm(x.cat).includes('bancodehoras')&&accepted.includes(norm(x.status)));if(!a.length)return alert('Nenhuma solicitação aceita encontrada para gerar o relatório.');const monthOf=x=>{let d=String(x.d||x.data||x.dataSolicitacao||'').trim(),m=d.match(/^(\d{4})-(\d{2})/);if(m)return m[1]+'-'+m[2];m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]:'Data não informada'};let months={};for(let x of a){let mes=monthOf(x),cia=String(x.cia||'Cia não informada'),re=String(x.re||x.RE||'').trim(),nome=String(x.nome||x.nomeGuerra||x.nome_de_guerra||'').trim(),key=norm(cia)+'|'+re+'|'+norm(nome);if(!months[mes])months[mes]={};if(!months[mes][key])months[mes][key]={cia,re,nome,horas:0,raw:[],qtd:0};let z=months[mes][key],t=String(x.tempo||x.tempoUltrapassado||x.horas||'').trim(),m=t.match(/^(\d+(?:[.,]\d+)?)\s*h(?:oras?)?$/i),hm=t.match(/^(\d{1,3}):(\d{2})$/),min=t.match(/^(\d+(?:[.,]\d+)?)\s*(?:min|minuto|minutos)$/i),val=m?parseFloat(m[1].replace(',','.')):hm?(+hm[1]+(+hm[2]/60)):min?(parseFloat(min[1].replace(',','.'))/60):(/^\d+(?:[.,]\d+)?$/.test(t)?parseFloat(t.replace(',','.')):NaN);if(Number.isFinite(val))z.horas+=val;z.raw.push(t);z.qtd++}const monthLabel=k=>{if(k==='Data não informada')return k;let [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};let sections=Object.keys(months).sort().map(mes=>{let list=Object.values(months[mes]).sort((a,b)=>a.cia.localeCompare(b.cia,'pt-BR')||a.nome.localeCompare(b.nome,'pt-BR'));let tot function natQ(q){q=q.trim().toLowerCase();$('#f_nat').value='';let a=q?[...NAT.filter(n=>n.toLowerCase().startsWith(q)),...NAT.filter(n=>!n.toLowerCase().startsWith(q)&&n.toLowerCase().includes(q))].slice(0,8):[];$('#natL').innerHTML=a.map(n=>`<button type=button class="chip sm" style="display:block;width:100%;text-align:left;margin-top:4px" data-n="${e(n)}" onclick="natSel(this.dataset.n)">${e(n)}</button>`).join('')}

function pic(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let k=Math.min(1,320/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);window.IMG=c.toDataURL('image/jpeg',.7)};i.src=r.result};r.readAsDataURL(f)}
